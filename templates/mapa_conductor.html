{% extends "base.html" %}

{% block content %}

<link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css" />
<script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>

<div class="card" style="height: 85vh; display: flex; flex-direction: column; padding: 5px; margin-bottom: 10px;">
    <h3 style="text-align: center; margin: 10px 0; font-size: 1.4rem;">Viajes en tiempo real 🏍️</h3>
    <div id="map" style="flex-grow: 1; border-radius: 10px; z-index: 1;"></div>
</div>

<style>
    .leaflet-routing-container { display: none !important; }

    .leaflet-control-zoom-in,
    .leaflet-control-zoom-out {
        width: 44px !important;
        height: 44px !important;
        line-height: 44px !important;
        font-size: 20px !important;
    }

    .leaflet-popup-content {
        font-size: 1.1rem !important;
        min-width: 150px !important;
        text-align: center;
    }

    .btn-aceptar-mapa {
        background: #27ae60;
        color: white;
        padding: 12px;
        border-radius: 8px;
        display: block;
        text-align: center;
        margin-top: 10px;
        text-decoration: none;
        font-weight: bold;
        font-size: 1rem;
        box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }

    .leaflet-marker-icon {
        border: none !important;
        background: transparent !important;
        filter: none !important;
    }

    /* ✅ TEXTO FIJO EN MAPA */
    .leaflet-tooltip.label-ruta {
        background: white !important;
        border: 2px solid #333 !important;
        border-radius: 6px !important;
        padding: 3px 8px !important;
        font-weight: bold !important;
        font-size: 13px !important;
        color: #000 !important;
        box-shadow: 0 2px 6px rgba(0,0,0,0.3) !important;
        opacity: 1 !important;
    }
</style>

<script>
let map;
let rutasActivas = [];
let viajeEnCurso = false;
let idViajeActivo = null;
let markersLayer = L.layerGroup();

// 🔵 ICONOS
const iconVerde = L.icon({
    iconUrl: "{{ url_for('static', filename='img/marker-icon-2x-green.png') }}",
    iconSize: [30, 50],
    iconAnchor: [15, 50],
    popupAnchor: [1, -34]
});

const iconRojo = L.icon({
    iconUrl: "{{ url_for('static', filename='img/marker-icon-2x-red.png') }}",
    iconSize: [30, 50],
    iconAnchor: [15, 50],
    popupAnchor: [1, -34]
});

// 🗺️ MAPA
function initMap() {
    map = L.map('map').setView([16.75, -96.67], 13);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap'
    }).addTo(map);

    markersLayer.addTo(map);

    setTimeout(() => map.invalidateSize(), 500);
}

// 🔄 CARGAR VIAJES
function cargarViajes() {
    fetch("/api_viajes")
    .then(res => res.json())
    .then(data => {
        markersLayer.clearLayers();

        rutasActivas.forEach(r => map.removeControl(r));
        rutasActivas = [];

        if (!data.viajes) return;

        data.viajes.forEach(v => {
            if (!v.lat || !v.lng || !v.lat_destino || !v.lng_destino) return;
            if (viajeEnCurso && v.id !== idViajeActivo) return;

            if (v.estado === "pendiente" || (v.estado === "aceptado" && v.id === idViajeActivo)) {

                let ruta = L.Routing.control({
                    waypoints: [
                        L.latLng(v.lat, v.lng),
                        L.latLng(v.lat_destino, v.lng_destino)
                    ],
                    createMarker: () => null,
                    addWaypoints: false,
                    draggableWaypoints: false,
                    show: false
                }).addTo(map);

                rutasActivas.push(ruta);

                // 🟢 ORIGEN
                markersLayer.addLayer(
                    L.marker([v.lat, v.lng], { icon: iconVerde })
                        .bindPopup(`
                            <b>📍 ORIGEN (RECOGIDA)</b><br>
                            <button onclick="aceptarViaje(${v.id})" class="btn-aceptar-mapa">
                                ACEPTAR
                            </button>
                        `)
                        .bindTooltip(`
                            <div style="background:white; padding:4px 8px; border:2px solid #27ae60; border-radius:6px; font-weight:bold; color:#27ae60; font-size:12px; white-space:nowrap;">
                                📍 ORIGEN
                            </div>
                        `, {
                            permanent: true,
                            direction: "top",
                            opacity: 1,
                            interactive: false
                        })
                );

                // 🔴 DESTINO
                markersLayer.addLayer(
                    L.marker([v.lat_destino, v.lng_destino], { icon: iconRojo })
                        .bindPopup(`<b>🏁 DESTINO FINAL</b>`)
                        .bindTooltip(`
                            <div style="background:white; padding:4px 8px; border:2px solid #e74c3c; border-radius:6px; font-weight:bold; color:#e74c3c; font-size:12px; white-space:nowrap;">
                                🏁 DESTINO
                            </div>
                        `, {
                            permanent: true,
                            direction: "top",
                            opacity: 1,
                            interactive: false
                        })
                );
            }
        });
    })
    .catch(err => console.error("Error al cargar viajes:", err));
}

// 🚀 INIT
document.addEventListener("DOMContentLoaded", function () {
    initMap();
    cargarViajes();
    setInterval(cargarViajes, 15000);
});
</script>

{% endblock %}
